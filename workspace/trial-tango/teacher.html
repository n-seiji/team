<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>先生用 - 小テスト</title>
<link rel="stylesheet" href="style.css">
<style>
#teacher{max-width:720px;margin:0 auto;padding:12px 16px}
#teacher h1{font-size:1.3rem}#teacher h2{font-size:1.1rem;margin-top:24px}
#teacher textarea{width:100%;font:inherit;margin:8px 0}
#teacher input[readonly],#form-url{width:100%;font:inherit;padding:8px;margin:8px 0}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;background:#fff}th,td{border:1px solid #d5d9e5;padding:6px 10px;text-align:left}
td.num,th.num{text-align:right}tr.dup td{background:#fff4d6}
table.no-time .at{display:none}
.err{color:#b3261e}.sum{font-weight:700}
</style>
</head>
<body>
<main id="teacher">
  <h1>先生用: 小テストを作る・集計する</h1>
  <p class="msg">入力した内容は、この端末の中だけで処理します。外には送りません。</p>

  <section aria-labelledby="h-make">
    <h2 id="h-make">1. テストリンクを作る</h2>
    <label for="list">単語リスト (1行に「英語,日本語」。30問まで)</label>
    <textarea id="list" rows="8" placeholder="run,走る、運営する&#10;apple,りんご"></textarea>
    <label for="form-url">結果を集める Google フォームの URL (なくても作れます)</label>
    <input id="form-url" inputmode="url" autocomplete="off" placeholder="https://forms.gle/…">
    <button id="make" class="btn primary">リンクを作る</button>
    <p id="make-msg" class="msg" role="status"></p>
    <ul id="make-errors" class="err"></ul>
    <div id="make-out" hidden>
      <label for="link">生徒に送るリンク (テストID: <span id="make-id"></span>)</label>
      <input id="link" readonly>
      <button id="copy-link" class="btn">リンクをコピー</button>
    </div>
  </section>

  <section aria-labelledby="h-agg">
    <h2 id="h-agg">2. 結果コードを集計する</h2>
    <label for="codes">結果コード (1行に1つ。Google フォームの回答の列を、見出しごと貼れます)</label>
    <textarea id="codes" rows="8" placeholder="abc123-2B-14-27-30-ひなた-xxxx"></textarea>
    <label id="id-label" for="id-pick" hidden>集計するテスト:
      <select id="id-pick"></select>
    </label>
    <p id="agg-summary" class="sum" role="status"></p>
    <div class="tbl-wrap"><table id="agg-table" hidden>
      <thead><tr><th>組</th><th class="num">番号</th><th>ニックネーム</th><th class="num">点数</th><th>同じ番号</th><th class="at">提出時刻</th></tr></thead>
      <tbody></tbody>
    </table></div>
    <ul id="agg-skipped" class="err"></ul>
    <button id="csv" class="btn" hidden>CSV で書き出す</button>
    <button id="clear" class="btn" hidden>貼った内容を消す</button>
  </section>
</main>
<script type="module" src="teacher.js"></script>
</body>
</html>

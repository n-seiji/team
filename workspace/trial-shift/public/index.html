<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>シフト希望を出す</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <h1>シフト希望を出す</h1>

  <label class="field">あなたの名前
    <select id="who"><option value="">選んでください</option></select>
  </label>
  <label class="field">対象の月
    <input id="month" type="month">
  </label>

  <p id="empty" class="hint">名前を選ぶと、カレンダーが出ます。</p>

  <section id="form" hidden>
    <p id="prev" class="hint" role="status"></p>
    <p class="hint">日ごとに「入れる」か「入れない」を押してください。もう一度押すと取り消せます。</p>
    <ul id="days" class="days"></ul>
    <div class="submitbar">
      <button id="submit" class="primary" type="button">提出する</button>
    </div>
    <div id="result" role="status" aria-live="polite"></div>
  </section>
</main>
<script type="module" src="staff.js"></script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スマホで開く</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="start">
<main class="start-main">
  <h1>スマホで開いてください</h1>
  <div id="qr" class="qr" aria-live="polite"><p class="note">QR コードを用意しています…</p></div>
  <p id="url" class="start-url"></p>
  <ol class="steps">
    <li>スマホのカメラでこの QR を読み、出てきたリンクを開く（読めないときは上の URL を入力）</li>
    <li>「📷 撮影」を押して領収書を撮り、「写真を使用」（Android は ✓）を押す</li>
    <li>一覧に1行増えたら登録完了。⚠ の欄は写真を見て直す</li>
  </ol>
  <p class="note left">スマホはこの PC と同じ Wi-Fi（またはこの PC のテザリング）につないでください。撮った写真はこの PC の中にだけ保存され、外には送りません。</p>
  <p id="others" class="note left" hidden></p>
</main>
<script type="module" src="start.js"></script>
</body>
</html>

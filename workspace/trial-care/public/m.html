<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>くすり</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: sans-serif; background: #fffaf0; color: #222; display: flex; flex-direction: column; padding: 16px; gap: 8px; min-height: 100vh; min-height: 100dvh; }
  #btn { flex: 1 1 auto; min-height: 280px; margin-top: 8px; width: 100%; font-size: 4rem; font-weight: bold; border: 0; border-radius: 24px; background: #2e7d32; color: #fff; cursor: pointer; }
  #btn:focus-visible { outline: 6px solid #1565c0; outline-offset: 4px; }
  #btn:active { background: #1b5e20; }
  #btn:disabled { background: #888; }
  #msg, #sub { overflow-wrap: anywhere; }
  #msg { font-size: 2rem; line-height: 1.5; font-weight: bold; margin: 0; }
  #sub { font-size: 1.4rem; line-height: 1.5; margin: 0; }
  #msg.err { color: #8a4b00; }
</style>
</head>
<body>
<p id="msg" role="status" aria-live="polite">きょうの くすりは？</p>
<p id="sub"></p>
<button id="btn" type="button">飲んだ</button>
<script>
(function () {
  var btn = document.getElementById('btn');
  var msg = document.getElementById('msg');
  var sub = document.getElementById('sub');
  function hm(at) { return String(at).replace(/^0/, ''); }
  function show(d) {
    msg.className = '';
    if (d && d.taken) {
      msg.textContent = '記録しました ' + hm(d.at);
      sub.textContent = 'もう一度 押しても 大丈夫です。';
    } else {
      msg.textContent = 'きょうは まだ 押していません';
      sub.textContent = 'あとからでも 押せます。';
    }
  }
  function fail() {
    msg.className = 'err';
    msg.textContent = 'うまくいきませんでした。もう一度押してください';
    sub.textContent = '';
  }
  function call(url, opt) {
    return fetch(url, opt).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    });
  }
  btn.addEventListener('click', function () {
    btn.disabled = true;
    call('taken', { method: 'POST' }).then(show, fail).then(function () { btn.disabled = false; btn.focus(); });
  });
  call('today').then(show, fail);
})();
</script>
</body>
</html>

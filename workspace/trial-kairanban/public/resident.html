<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>回覧板</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <h1 id="title" tabindex="-1">回覧板</h1>
  <div id="content" class="body" aria-live="polite"></div>
  <button id="read" class="read-btn" type="button" hidden>読みました</button>
  <p id="thanks" class="thanks" role="status" hidden></p>
  <p id="more" class="more" role="status" hidden></p>
  <button id="next" class="read-btn next-btn" type="button" hidden>次を読む</button>
</main>
<script src="/resident.js"></script>
</body>
</html>

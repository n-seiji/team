name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: mock session (smoke)
        shell: bash
        run: |
          d=$(mktemp -d)
          cp -r personas team.config.json "$d"/
          node src/main.ts init --root "$d" --name smoke --brief "smoke test"
          node src/main.ts run --root "$d" --backend mock
          node src/main.ts status --root "$d"
